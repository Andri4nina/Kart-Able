# Installateurs de Kart Able (application de bureau, smkw-desktop) pour Windows, macOS et Linux.
# Declenchement : un tag vX.Y.Z pousse sur GitHub, ou a la main (onglet Actions).
# Resultat : une version (release) GitHub en brouillon avec les installateurs :
#   Windows : .msi et -setup.exe (NSIS) ; macOS : .dmg (Apple Silicon et Intel) ;
#   Linux : .deb, .rpm et .AppImage.
name: Installateurs bureau

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependances Linux (WebKitGTK)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            smkw-ui/package-lock.json
            smkw-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: smkw-desktop -> target

      - name: Dependances du jeu web
        run: npm ci --prefix smkw-ui

      - name: Dependances de l'application
        run: npm ci --prefix smkw-desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: smkw-desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'kart-able-v__VERSION__' }}
          releaseName: 'Kart Able v__VERSION__'
          releaseBody: |
            Installateurs de Kart Able (Rasoamanana Andrianina).
            Reseau local : lancez l'application sur la machine hote ; les autres joueurs ouvrent
            l'adresse affichee dans le lobby (http://<IP>:2567) dans leur navigateur, ou la saisissent
            dans leur propre application (etape Connexion).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
